<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yankee Steam Digital Twin</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 21V9l5 3V9l5 3V9l5 3V4h3v17H3zm3-2h2v-3H6v3zm5 0h2v-3h-2v3zm5 0h2v-3h-2v3z"/></svg></span>
          <span class="brand-mill">Pulp &amp; Paper Mill</span>
          <span class="brand-div" aria-hidden="true"></span>
          <span class="brand-app">Yankee Dryer Digital Twin</span>
        </div>
        <nav class="tabs" role="tablist">
          <button class="tab" data-nav="twin" role="tab">Twin</button>
          <button class="tab" data-nav="dashboard" role="tab">Dashboard</button>
        </nav>
        <div class="topbar-right">
          <span class="online"><span class="dot"></span><span>System Online</span></span>
        </div>
      </header>

      <div id="views">
        <section id="twin-view" data-view="twin">
          <div id="viewport"></div>

          <header id="header" class="panel" hidden>
            <h1>Yankee Dryer Steam System — Digital Twin</h1>
            <p>Phase 1 · 3D model &amp; animation · simulated values</p>
          </header>

          <aside id="controls" class="panel"></aside>
          <div id="right-column">
            <aside id="status" class="panel"></aside>
            <aside id="info" class="panel" hidden></aside>
          </div>
        </section>

        <section id="dashboard-view" data-view="dashboard" hidden></section>
        <section id="maintenance-view" data-view="maintenance" hidden></section>
      </div>

      <div id="loading">
        <div>Loading Yankee_Steam_DigitalTwin.glb…</div>
        <div class="bar"><i id="loading-bar"></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
